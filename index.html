<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ลอยกระทงออนไลน์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Night river scene -->
  <div class="scene" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="sky-lanterns" id="skyLanterns"></div>
    <div class="moon"></div>
    <div class="skyline" id="skyline"></div>
    <div class="river">
      <div class="moon-reflection"></div>
      <div class="lane lane-back" id="laneBack"></div>
      <div class="lane lane-mid" id="laneMid"></div>
      <div class="lane lane-front" id="laneFront"></div>
    </div>
    <div class="fx" id="fx"></div>
  </div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- Background picker -->
  <div class="theme-picker" role="radiogroup" aria-label="พื้นหลัง">
    <button type="button" role="radio" data-theme="river" title="แม่น้ำกลางคืน" aria-label="แม่น้ำกลางคืน"></button>
    <button type="button" role="radio" data-theme="lanterns" title="โคมลอยเต็มฟ้า" aria-label="โคมลอยเต็มฟ้า"></button>
    <button type="button" role="radio" data-theme="temple" title="โบราณสถานยามเย็น" aria-label="โบราณสถานยามเย็น"></button>
    <button type="button" role="radio" data-theme="city" title="สะพานเมืองกับพลุ" aria-label="สะพานเมืองกับพลุ"></button>
  </div>

  <main class="ui">
    <header class="title">
      <h1>ลอยกระทงออนไลน์</h1>
      <p>เลือกกระทง · อธิษฐาน · ลอยไปพร้อมทุกคน · รับเลขมงคล</p>
    </header>

    <!-- Step 2 + 3: choose a kratong, write a wish -->
    <section class="panel" id="formPanel">
      <h2>เลือกกระทงของคุณ</h2>
      <div class="kratong-picker" id="picker" role="radiogroup" aria-label="แบบกระทง"></div>

      <div class="photo-upload hidden" id="photoUpload">
        <div class="photo-preview" id="photoPreview"><span>ไม่มีรูป</span></div>
        <div class="photo-actions">
          <label class="btn-ghost small" for="photoInput">เลือกรูปหน้า</label>
          <input type="file" id="photoInput" accept="image/*" class="visually-hidden" />
          <button type="button" class="link-btn hidden" id="photoClear">ลบรูป</button>
          <p class="hint">รูปจะลอยไปบนแม่น้ำให้ทุกคนที่เปิดเว็บเห็น ใช้รูปของตัวเองหรือรูปที่เจ้าของยินยอมเท่านั้น</p>
        </div>
      </div>

      <form id="wishForm" novalidate>
        <label for="nameInput">ชื่อของคุณ</label>
        <input id="nameInput" maxlength="30" autocomplete="nickname" placeholder="เช่น น้องมะลิ" />

        <label for="wishInput">คำอธิษฐาน <span class="count" id="wishCount">0/120</span></label>
        <textarea id="wishInput" maxlength="120" rows="3" placeholder="ขอให้ครอบครัวมีความสุข สุขภาพแข็งแรง…"></textarea>

        <p class="bonus-note hidden" id="bonusNote"></p>
        <p class="error" id="formError" role="alert"></p>
        <button type="submit" class="btn-primary" id="floatBtn">ลอยกระทง</button>
        <button type="button" class="btn-ghost game-open" data-open-games>เล่นมินิเกมก่อนลอย</button>
      </form>
    </section>

    <!-- Step 5 + 6: number reveal while the kratong floats -->
    <section class="panel lucky-panel hidden" id="floatingPanel" aria-live="polite">
      <p class="lucky-label">เลขมงคลของคุณ</p>
      <div class="lucky-number" id="luckyNumber">00</div>
      <p class="floating-note" id="floatingNote">กระทงของคุณกำลังลอยไป…</p>
      <p class="fx-label" id="fxLabel"></p>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </section>

    <!-- Step 7: result -->
    <section class="panel hidden" id="resultPanel">
      <h2>ขอให้คำอธิษฐานเป็นจริง</h2>
      <p class="result-wish" id="resultWish"></p>
      <p class="lucky-label">เลขมงคลของคุณคือ</p>
      <div class="lucky-number big" id="resultNumber">00</div>
      <div class="result-actions">
        <button type="button" class="btn-primary" id="againBtn">ลอยอีกครั้ง</button>
        <button type="button" class="btn-ghost" id="shareBtn">แชร์</button>
      </div>
      <button type="button" class="btn-ghost game-open" data-open-games>เล่นมินิเกม</button>
      <p class="share-note" id="shareNote"></p>
    </section>

    <p class="river-status" id="riverStatus"></p>
  </main>

  <!-- Mini games -->
  <div class="game-overlay hidden" id="gameOverlay" role="dialog" aria-modal="true" aria-labelledby="gameTitle">
    <div class="game-box">
      <div class="game-head">
        <button type="button" class="icon-btn hidden" id="gameBack" aria-label="กลับไปเลือกเกม">‹</button>
        <h2 id="gameTitle">เลือกมินิเกม</h2>
        <button type="button" class="icon-btn" id="gameClose" aria-label="ปิด">×</button>
      </div>

      <div class="game-menu" id="gameMenu">
        <button type="button" class="game-card" data-game="catch">
          <b>เก็บดอกไม้แต่งกระทง</b>
          <span>เลื่อนกระทงรับดอกไม้ หลบขยะ ดอกไม้ที่ได้จะไปแต่งกระทงใบถัดไป</span>
          <small id="best-catch"></small>
        </button>
        <button type="button" class="game-card" data-game="candle">
          <b>ประคองเทียนฝ่าลม</b>
          <span>แตะฝั่งที่ลมมาเพื่อบังเปลวเทียน ประคองให้ติดจนหมดเวลา</span>
          <small id="best-candle"></small>
        </button>
        <button type="button" class="game-card" data-game="memory">
          <b>จับคู่ไพ่ลอยกระทง</b>
          <span>พลิกไพ่หาคู่ให้ครบ 12 ใบ ยิ่งพลิกน้อยยิ่งได้ดาวมาก</span>
          <small id="best-memory"></small>
        </button>
      </div>

      <div class="game-stage hidden" id="gameStage">
        <div class="game-hud"><span id="hudLeft"></span><span id="hudRight"></span></div>
        <canvas id="gameCanvas" width="360" height="480"></canvas>
        <div class="memory-grid hidden" id="memoryGrid"></div>
        <p class="game-help" id="gameHelp"></p>
      </div>

      <div class="game-result hidden" id="gameResult">
        <p class="game-score" id="gameScore"></p>
        <p class="game-reward" id="gameReward"></p>
        <div class="result-actions">
          <button type="button" class="btn-primary" id="gameReplay">เล่นอีกครั้ง</button>
          <button type="button" class="btn-ghost" id="gameMenuBtn">เกมอื่น</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
