<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ลอยกระทงออนไลน์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Night river scene -->
  <div class="scene" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="far-bank"></div>
    <div class="river">
      <div class="moon-reflection"></div>
      <div class="lane lane-back" id="laneBack"></div>
      <div class="lane lane-mid" id="laneMid"></div>
      <div class="lane lane-front" id="laneFront"></div>
    </div>
  </div>

  <main class="ui">
    <header class="title">
      <h1>ลอยกระทงออนไลน์</h1>
      <p>เลือกกระทง · อธิษฐาน · ลอยไปพร้อมทุกคน · รับเลขมงคล</p>
    </header>

    <!-- Step 2 + 3: choose a kratong, write a wish -->
    <section class="panel" id="formPanel">
      <h2>เลือกกระทงของคุณ</h2>
      <div class="kratong-picker" id="picker" role="radiogroup" aria-label="แบบกระทง"></div>

      <form id="wishForm" novalidate>
        <label for="nameInput">ชื่อของคุณ</label>
        <input id="nameInput" maxlength="30" autocomplete="nickname" placeholder="เช่น น้องมะลิ" />

        <label for="wishInput">คำอธิษฐาน <span class="count" id="wishCount">0/120</span></label>
        <textarea id="wishInput" maxlength="120" rows="3" placeholder="ขอให้ครอบครัวมีความสุข สุขภาพแข็งแรง…"></textarea>

        <p class="error" id="formError" role="alert"></p>
        <button type="submit" class="btn-primary" id="floatBtn">ลอยกระทง</button>
      </form>
    </section>

    <!-- Step 5 + 6: number reveal while the kratong floats -->
    <section class="panel lucky-panel hidden" id="floatingPanel" aria-live="polite">
      <p class="lucky-label">เลขมงคลของคุณ</p>
      <div class="lucky-number" id="luckyNumber">00</div>
      <p class="floating-note" id="floatingNote">กระทงของคุณกำลังลอยไป…</p>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </section>

    <!-- Step 7: result -->
    <section class="panel hidden" id="resultPanel">
      <h2>ขอให้คำอธิษฐานเป็นจริง</h2>
      <p class="result-wish" id="resultWish"></p>
      <p class="lucky-label">เลขมงคลของคุณคือ</p>
      <div class="lucky-number big" id="resultNumber">00</div>
      <div class="result-actions">
        <button type="button" class="btn-primary" id="againBtn">ลอยอีกครั้ง</button>
        <button type="button" class="btn-ghost" id="shareBtn">แชร์</button>
      </div>
      <p class="share-note" id="shareNote"></p>
    </section>

    <p class="river-status" id="riverStatus"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
